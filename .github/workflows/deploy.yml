name: Deploy front page to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Also allows a manual run from the Actions tab

jobs:
  # GitHub Pages serves the gh-pages branch. The front page goes in its root; each game repo
  # pushes itself into its own folder there, so only the front page files are replaced here.
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Deploy to GitHub Pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Game repos may push at the same time, so retry on a rejected push.
          for attempt in 1 2 3 4 5; do
            rm -rf billeder
            cp ../src/index.html .
            cp -r ../src/billeder billeder
            # Keeps Pages from dropping folders that start with _ (the games' _framework)
            touch .nojekyll
            git add -A index.html billeder .nojekyll
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Deploy front page from ${GITHUB_SHA::7}"
            if git push origin gh-pages; then exit 0; fi
            sleep $((attempt * 5))
            git fetch --depth 1 origin gh-pages
            git reset -q --hard FETCH_HEAD
          done
          exit 1
