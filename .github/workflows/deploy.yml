name: Deploy front page to FTP and GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Also allows a manual run from the Actions tab

jobs:
  deploy-ftp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Uploads the site as-is (no build). Only changed files are sent after the first run.
      # The games live in subfolders next to it (kidsgames/clockmaster/ etc.), deployed by their own repos.
      # Repository secrets (Settings > Secrets and variables > Actions):
      #   FTP_HOST      e.g. ftp.example.com
      #   FTP_USERNAME
      #   FTP_PASSWORD
      #   FTP_FOLDER    webroots/www/kidsgames  (no trailing slash)
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_FOLDER }}/
          local-dir: ./
          # dangerous-clean-slate stays off, so the game folders next to the site are never touched
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            images/**
            README.md

  # GitHub Pages serves the gh-pages branch. The front page goes in its root; each game repo
  # pushes itself into its own folder there, so only the front page files are replaced here.
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Deploy to GitHub Pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Game repos may push at the same time, so retry on a rejected push.
          for attempt in 1 2 3 4 5; do
            rm -rf billeder
            cp ../src/index.html .
            cp -r ../src/billeder billeder
            # Keeps Pages from dropping folders that start with _ (the games' _framework)
            touch .nojekyll
            git add -A index.html billeder .nojekyll
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Deploy front page from ${GITHUB_SHA::7}"
            if git push origin gh-pages; then exit 0; fi
            sleep $((attempt * 5))
            git fetch --depth 1 origin gh-pages
            git reset -q --hard FETCH_HEAD
          done
          exit 1
