<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="shape"><rect width="512" height="512" rx="112" /></clipPath>
    <clipPath id="uk-half"><path d="M512,0 L512,512 L0,512 Z" /></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <g clip-path="url(#shape)">
    <!-- Danish flag fills the top-left half -->
    <rect width="512" height="512" fill="#C8102E" />
    <rect x="150" width="64" height="512" fill="#fff" />
    <rect y="224" width="512" height="64" fill="#fff" />
    <!-- Union Jack fills the bottom-right half -->
    <g clip-path="url(#uk-half)">
      <rect width="512" height="512" fill="#012169" />
      <path d="M0,0 L512,512" stroke="#fff" stroke-width="56" />
      <path d="M0,0 L512,512" stroke="#C8102E" stroke-width="18" />
      <path d="M256,0 V512 M0,256 H512" stroke="#fff" stroke-width="88" />
      <path d="M256,0 V512 M0,256 H512" stroke="#C8102E" stroke-width="52" />
    </g>
    <path d="M512,0 L0,512" stroke="#fff" stroke-width="14" />
  </g>
  <!-- Number badge -->
  <circle cx="256" cy="256" r="150" fill="#fff8ec" stroke="#2b2340" stroke-width="14" filter="url(#shadow)" />
  <text x="256" y="256" dy="0.35em" text-anchor="middle"
        font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900"
        font-size="176" fill="#2b2340">12</text>
</svg>
