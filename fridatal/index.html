<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FridaTal</title>
    <base href="fridatal" />

    <!-- Icons: .ico for Windows/desktop browsers, PNGs for iOS home screen and PWA installs -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#8338ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FridaTal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="loading">Indlæser FridaTal…</div>
    </div>

    <!-- "Alle spil" link in the footer (../ is the KidsGames front page). Needed when the front page
         is pinned as an app or the browser is in full screen, where there is no back button. -->
    <style>
        .kg-home {
            display: inline-flex; align-items: center; gap: .35em; margin: 0 .5em .25em 0;
            padding: .3em .85em; border-radius: 999px; font: 700 .85rem/1.2 system-ui, sans-serif;
            background: #fff; color: #2b2340; text-decoration: none; vertical-align: middle;
            border: 1px solid rgba(43, 35, 64, .25); -webkit-tap-highlight-color: transparent;
        }
        .kg-home:hover, .kg-home:focus-visible { border-color: #2b2340; }
        .kg-home svg { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <div id="blazor-error-ui">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/sounds.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
