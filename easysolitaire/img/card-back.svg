<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 142" preserveAspectRatio="xMidYMid slice">
  <!-- Back of the cards: blue with a diamond lattice, a thin white frame and a paw print in the middle.
       Same proportions as a card (1 : 1.42). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b86f5" />
      <stop offset="1" stop-color="#1f56c9" />
    </linearGradient>
    <pattern id="lattice" width="10" height="10" patternUnits="userSpaceOnUse" x="0" y="1">
      <path d="M5 0 10 5 5 10 0 5Z" fill="#fff" fill-opacity=".16" />
      <circle cx="0" cy="0" r="1" fill="#fff" fill-opacity=".35" />
      <circle cx="10" cy="0" r="1" fill="#fff" fill-opacity=".35" />
      <circle cx="0" cy="10" r="1" fill="#fff" fill-opacity=".35" />
      <circle cx="10" cy="10" r="1" fill="#fff" fill-opacity=".35" />
    </pattern>
  </defs>

  <rect width="100" height="142" fill="url(#bg)" />
  <rect x="7" y="7" width="86" height="128" rx="6" fill="url(#lattice)" stroke="#fff" stroke-opacity=".75" stroke-width="1.6" />

  <!-- Medallion with a paw print -->
  <circle cx="50" cy="71" r="21" fill="#fff" />
  <circle cx="50" cy="71" r="17.5" fill="none" stroke="#2f6fed" stroke-width="1.4" stroke-opacity=".5" />
  <g fill="#2f6fed">
    <ellipse cx="50" cy="77" rx="8" ry="6.6" />
    <ellipse cx="40.6" cy="68.4" rx="3.2" ry="4" transform="rotate(-22 40.6 68.4)" />
    <ellipse cx="46.2" cy="62.4" rx="3.2" ry="4.2" transform="rotate(-8 46.2 62.4)" />
    <ellipse cx="53.8" cy="62.4" rx="3.2" ry="4.2" transform="rotate(8 53.8 62.4)" />
    <ellipse cx="59.4" cy="68.4" rx="3.2" ry="4" transform="rotate(22 59.4 68.4)" />
  </g>
</svg>
