<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FridaTal</title>
    <base href="fridatal" />

    <!-- Icons: .ico for Windows/desktop browsers, PNGs for iOS home screen and PWA installs -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#8338ec" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FridaTal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="loading">Indlæser FridaTal…</div>
    </div>

    <!-- "Alle spil" button at the top right, back to the KidsGames front page (../). Needed when the
         front page is pinned as an app or the browser is in full screen, where there is no back button.
         On narrow screens only the house icon shows. -->
    <style>
        .kg-home {
            display: inline-flex; align-items: center; justify-content: center; gap: .4rem; flex: none;
            min-width: 2.9rem; height: 2.9rem; padding: 0 1rem; box-sizing: border-box; border-radius: 999px;
            background: #fff; color: #2b2340; text-decoration: none; white-space: nowrap;
            font: 700 1.1rem/1 "Fredoka", system-ui, sans-serif;
            box-shadow: 0 .25rem 0 rgba(43, 35, 64, .18), 0 .5rem 1rem -.5rem rgba(43, 35, 64, .35);
            -webkit-tap-highlight-color: transparent;
        }
        .kg-home:active { transform: translateY(.2rem); box-shadow: 0 .05rem 0 rgba(43, 35, 64, .18); }
        .kg-home:focus-visible { outline: 3px solid #4dabf7; outline-offset: 2px; }
        .kg-home svg { width: 1.6rem; height: 1.6rem; flex: none; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .kg-corner { position: absolute; z-index: 10; top: max(.75rem, env(safe-area-inset-top)); right: max(.75rem, env(safe-area-inset-right)); }
        @media (max-width: 720px) {
            .kg-home { padding: 0; width: 2.9rem; }
            .kg-text { display: none; }
        }
    </style>

    <div id="blazor-error-ui">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="js/sounds.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
