# Dependabot version updates (free for public and private repositories).
# Security updates and alerts are switched on in Settings > Advanced Security.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: ["minor", "patch"]
